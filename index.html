<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gender Reveal</title>
<meta name="description" content="赤ちゃんの性別をサプライズで発表しよう">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="host" class="screen" hidden>
  <h1>Gender Reveal</h1>
  <p class="lead">赤ちゃんの性別を選んで、発表用のURLを作りましょう。<br>選んだ内容はURLを見ても分からないようになっています。</p>
  <label class="field">
    <span>お名前(任意)</span>
    <input id="from" type="text" maxlength="30" placeholder="例:たなか家">
  </label>
  <div class="choices">
    <button class="choice boy" data-g="boy" type="button">男の子</button>
    <button class="choice girl" data-g="girl" type="button">女の子</button>
  </div>
  <section id="result" hidden>
    <p>発表用URLができました。<br>このURLを家族や友だちに送ってください。</p>
    <input id="url" type="text" readonly>
    <div class="row">
      <button id="copy" type="button" class="btn">コピー</button>
      <button id="share" type="button" class="btn" hidden>共有</button>
    </div>
    <p class="code">コード: <span id="code"></span></p>
    <button id="again" type="button" class="link">選び直す</button>
  </section>
</main>

<main id="reveal" class="screen" hidden>
  <p id="fromText" class="from"></p>
  <h1 id="title">赤ちゃんは…</h1>
  <button id="gift" type="button" class="gift" aria-label="タップして開ける">
    <span class="lid"></span>
    <span class="box"></span>
    <span class="ribbon"></span>
  </button>
  <p id="hint" class="hint">タップしてね</p>
  <p id="answer" class="answer" hidden></p>
  <a id="makeOwn" class="link" href="./" hidden>自分でも作る</a>
</main>

<main id="invalid" class="screen" hidden>
  <h1>URLが正しくありません</h1>
  <p class="lead">送ってもらったURLをもう一度確認してください。</p>
</main>

<canvas id="confetti"></canvas>
<script src="app.js"></script>
</body>
</html>
